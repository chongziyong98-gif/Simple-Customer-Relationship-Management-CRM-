<!DOCTYPE html>
<html>
<head>
    <title>Add Quotation</title>
</head>
<body>
    <h2>Add New Quotation</h2>

    <form method="post">
        <label>Quotation No:</label><br>
        <input type="text" name="quotation_no" required><br><br>

        <label>Company Name:</label><br>
        <input type="text" name="company_name" required><br><br>

        <label>Project:</label><br>
        <input type="text" name="project"><br><br>

        <label>Quoted Price:</label><br>
        <input type="number" name="quoted_price" step="0.01" required><br><br>

        <label>Status:</label><br>
        <input type="text" name="status" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
