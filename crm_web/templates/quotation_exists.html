<!DOCTYPE html>
<html>
<head>
    <title>Quotation Exists</title>
</head>
<body>

<h2>Quotation already exists</h2>

<p>
    Quotation No: {{ quotation.quotation_no }} <br>
    Company: {{ quotation.company_name }} <br>
    Project: {{ quotation.project }} <br>
    Price: {{ quotation.quoted_price }} <br>
    Status: {{ quotation.status }}
</p>

<a href="{{ url_for('update_quotation', quotation_no=quotation.quotation_no) }}">
    Go to update quotation
</a>

<br><br>

<a href="{{ url_for('add_quotation') }}">
    Back to add quotation
</a>

</body>
</html>
